<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-es="Club Social Royal Palm Sampaka - Inicio de Sesión" data-en="Royal Palm Sampaka Social Club - Login" data-fr="Club Social Royal Palm Sampaka - Connexion">Club Social Royal Palm Sampaka - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            color: #333;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-container h1 {
            color: #1a3c34;
            font-size: 2em;
            margin-bottom: 20px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px 10px 10px 40px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        button {
            background: #1a3c34;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
        }
        .error {
            color: red;
            margin-bottom: 10px;
        }
        .register-link {
            margin-top: 20px;
        }
        .back-to-home {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container animate__animated animate__fadeInUp">
        <h1 data-es="Inicio de Sesión" data-en="Login" data-fr="Connexion">Inicio de Sesión</h1>
        <!-- Placeholder for error message -->
        <div class="error">Error de ejemplo (si aplica)</div>
        <form method="POST" action="login.html" id="login-form">
            <!-- Assuming step 'email' as default -->
            <input type="hidden" name="step" value="email">
            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="text" id="email_or_username" name="email_or_username" placeholder="Correo o Nombre de Usuario" required>
            </div>
            <button type="submit" aria-label="Continuar">
                <i class="fas fa-arrow-right"></i> Continuar
            </button>
        </form>
        <div class="register-link">
            <p data-es="¿No tiene cuenta? <a href='registro.html'>Regístrese aquí</a>" data-en="Don't have an account? <a href='registro.html'>Register here</a>" data-fr="Vous n'avez pas de compte ? <a href='registro.html'>Inscrivez-vous ici</a>">¿No tiene cuenta? <a href="registro.html">Regístrese aquí</a></p>
        </div>
        <div class="back-to-home">
            <a href="inicio.html" data-es="Volver al inicio" data-en="Back to Home" data-fr="Retour à l'accueil"><i class="fas fa-home"></i> Volver al inicio</a>
        </div>
    </div>
</body>
</html>
