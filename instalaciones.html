<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-es="Club Social Royal Palm Sampaka - Instalaciones" data-en="Royal Palm Sampaka Social Club - Facilities" data-fr="Club Social Royal Palm Sampaka - Installations">Club Social Royal Palm Sampaka - Instalaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/scripts.js" defer></script>
    <style>
        :root {
            --primary: linear-gradient(135deg, #ffffff, #f8f9fa);
            --accent: #1a3c34;
            --secondary: #f5f5f5;
            --text: #333;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        body {
            background: var(--primary);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
        }
        .installation-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }
        .installation-section h1 {
            color: var(--accent);
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeInUp 1s ease;
        }
        .installation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .installation-item {
            background: var(--secondary);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .installation-item:hover {
            transform: translateY(-5px);
        }
        .installation-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .installation-item h3 {
            font-size: 1.5em;
            margin: 15px;
            color: var(--accent);
        }
        .installation-item p {
            margin: 0 15px 15px;
            font-size: 1em;
        }
        .carousel {
            position: relative;
            max-width: 1200px;
            margin: 40px auto;
            overflow: hidden;
        }
        #carouselInner {
            display: flex;
            transition: transform 0.5s ease;
        }
        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }
        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
        }
        .carousel-item h3 {
            font-size: 2em;
            margin: 15px 0;
            color: var(--accent);
        }
        .carousel-item p {
            font-size: 1.2em;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
        #prevBtn {
            left: 10px;
        }
        #nextBtn {
            right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html" data-es="Inicio" data-en="Home" data-fr="Accueil">Inicio</a></li>
                <li><a href="sobre-nosotros.html" data-es="Sobre Nosotros" data-en="About Us" data-fr="À Propos">Sobre Nosotros</a></li>
                <li><a href="instalaciones.html" data-es="Instalaciones" data-en="Facilities" data-fr="Installations">Instalaciones</a></li>
                <li><a href="eventos.html" data-es="Eventos" data-en="Events" data-fr="Événements">Eventos</a></li>
                <li><a href="contacto.html" data-es="Contacto" data-en="Contact" data-fr="Contact">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="installation-section animate__animated animate__fadeInUp">
            <h1 data-es="Instalaciones" data-en="Facilities" data-fr="Installations">Instalaciones</h1>
            <div id="instalaciones" class="installation-grid">
                <!-- Placeholder for static installations content -->
                <div class="installation-item" onclick="window.location.href='instalacion1.html'">
                    <img src="imagenes/placeholder-installation.jpg" alt="Instalación de ejemplo">
                    <h3>Instalación de ejemplo</h3>
                    <p>Descripción de la instalación.</p>
                </div>
            </div>
        </section>
        <div class="carousel">
            <div id="carouselInner"></div>
            <button id="prevBtn" class="carousel-btn" onclick="prevSlide()">&#9664;</button>
            <button id="nextBtn" class="carousel-btn" onclick="nextSlide()">&#9654;</button>
        </div>
    </main>
    <footer>
        <div class="footer-section">
            <h3 data-es="Síguenos" data-en="Follow Us" data-fr="Suivez-nous">Síguenos</h3>
            <p class="social-links">
                <a href="https://wa.me/+240555797427" target="_blank" data-es="WhatsApp" data-en="WhatsApp" data-fr="WhatsApp">WhatsApp</a> |
                <a href="https://www.instagram.com/royalpalmclubsocial" target="_blank" data-es="Instagram" data-en="Instagram" data-fr="Instagram">Instagram</a> |
                <a href="https://x.com" target="_blank" data-es="X" data-en="X" data-fr="X">X</a>
            </p>
            <p data-es="© 2025 Royal Palm Sampaka. Todos los derechos reservados." data-en="© 2025 Royal Palm Sampaka. All rights reserved." data-fr="© 2025 Royal Palm Sampaka. Tous droits réservés.">© 2025 Royal Palm Sampaka. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script>
let currentSlide = 0;

async function loadInstallations() {
    try {
        const response = await fetch('api/instalaciones.php');
        const result = await response.json();
        const container = document.getElementById('instalaciones');
        const carouselInner = document.getElementById('carouselInner');
        container.innerHTML = '';
        carouselInner.innerHTML = '';
        if (result.success) {
            result.data.forEach(instalacion => {
                const item = document.createElement('div');
                item.className = 'installation-item';
                item.innerHTML = `
                    <img src="${instalacion.imagen || 'imagenes/placeholder-installation.jpg'}" alt="${instalacion.nombre}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjBmMGYwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iI2NjYyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='" onclick="window.location.href='${instalacion.url}'">
                    <h3>${instalacion.nombre}</h3>
                    <p>${instalacion.descripcion}</p>
                `;
                container.appendChild(item);
                // Add to carousel
                const carouselItem = document.createElement('div');
                carouselItem.className = 'carousel-item';
                carouselItem.innerHTML = `
                    <img src="${instalacion.imagen || 'imagenes/placeholder-installation.jpg'}" alt="${instalacion.nombre}" onclick="window.location.href='${instalacion.url}'">
                    <h3>${instalacion.nombre}</h3>
                    <p>${instalacion.descripcion}</p>
                `;
                carouselInner.appendChild(carouselItem);
            });
            showSlide(currentSlide);
        } else {
            container.innerHTML = `<p class="error-message">Error al cargar instalaciones: ${result.error}</p>`;
        }
    } catch (error) {
        document.getElementById('instalaciones').innerHTML = `<p class="error-message">Error al cargar instalaciones: ${error.message}</p>`;
    }
}

function showSlide(index) {
    const slides = document.querySelectorAll('.carousel-item');
    const totalSlides = slides.length;
    if (totalSlides === 0) return;
    currentSlide = (index + totalSlides) % totalSlides;
    document.getElementById('carouselInner').style.transform = `translateX(-${currentSlide * 100}%)`;
}

function nextSlide() {
    showSlide(currentSlide + 1);
}

function prevSlide() {
    showSlide(currentSlide - 1);
}

setInterval(nextSlide, 5000);
loadInstallations();
</script>
</body>
</html>
