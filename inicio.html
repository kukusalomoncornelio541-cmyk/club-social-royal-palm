<script>
document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('heroVideo');
    const audio = document.getElementById('backgroundAudio');
    const audioPlayer = document.querySelector('.audio-player');

    // Promesas para esperar a que ambos elementos estén listos
    const videoReady = new Promise(resolve => {
        video.addEventListener('loadeddata', () => resolve());
    });
    const audioReady = new Promise(resolve => {
        audio.addEventListener('loadeddata', () => resolve());
    });

    // Cuando ambos estén listos, iniciar reproducción
    Promise.all([videoReady, audioReady]).then(() => {
        try {
            video.play();
            audio.play().then(() => {
                audioPlayer.classList.add('active');
            }).catch(e => {
                console.log('Autoplay bloqueado:', e);
                audioPlayer.style.display = 'block'; // Mostrar controles si autoplay falla
            });
        } catch (e) {
            console.log('Error al iniciar reproducción:', e);
            audioPlayer.style.display = 'block';
        }
    });

    // Sincronizar eventos de pausa/reproducción
    video.addEventListener('pause', () => audio.pause());
    video.addEventListener('play', () => {
        if (audio.paused) {
            audio.play().catch(e => console.log('Error al reanudar audio:', e));
        }
    });

    // Sincronizar el tiempo del audio con el video si se busca
    video.addEventListener('seeked', () => {
        audio.currentTime = video.currentTime;
    });
});
</script>
